<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>商城後台｜韋德機車精品</title>
<meta name="theme-color" content="#16181d">
<style>
:root{--bg:#f4f4f2;--card:#fff;--ink:#16181d;--ink2:#5b5f68;--line:#e3e3df;--accent:#e5381f;--ok:#1f8a4c;--warn:#b26a00;--r:12px;--shadow:0 1px 2px rgba(0,0,0,.06),0 4px 14px rgba(0,0,0,.05)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 -apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif}
button{font:inherit;color:inherit;cursor:pointer}
img{display:block;max-width:100%}
header{position:sticky;top:0;z-index:10;background:var(--ink);color:#fff}
.hd{max-width:820px;margin:0 auto;display:flex;align-items:center;gap:10px;height:54px;padding:0 16px}
.hd b{display:inline-grid;place-items:center;width:28px;height:28px;border-radius:7px;background:var(--accent)}
.hd h1{font-size:16px;margin:0}
.home{display:flex;align-items:center;gap:10px;flex:1;color:#fff!important;text-decoration:none;font-size:inherit!important;min-width:0}
.home img{height:30px;max-width:140px;object-fit:contain;display:block}
.lgprev{display:flex;align-items:center;gap:14px;background:var(--ink);border-radius:10px;padding:14px;color:#fff;font-weight:800}
.lgprev img{height:36px;max-width:180px;object-fit:contain}
.hd a{color:#cfd2d8;font-size:13px}
main{max-width:820px;margin:0 auto;padding:14px 16px 90px}
.box{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);padding:16px;margin-bottom:14px}
.box h2{font-size:15px;margin:0 0 10px}
input,select,textarea{font:inherit;width:100%;border:1px solid var(--line);border-radius:8px;padding:10px 11px;background:#fff;color:var(--ink)}
input:focus,select:focus,textarea:focus{outline:2px solid #f3b4a9;border-color:var(--accent)}
label.f{display:block;margin-top:12px}
label.f>span{display:block;font-size:13px;color:var(--ink2);margin-bottom:4px}
.btn{height:44px;padding:0 18px;border-radius:10px;border:1px solid var(--accent);background:#fff;color:var(--accent);font-weight:700}
.btn.solid{background:var(--accent);color:#fff}
.btn.gray{border-color:var(--line);color:var(--ink2)}
.btn.sm{height:32px;padding:0 10px;font-size:13px;border-radius:8px}
.btn:disabled{opacity:.5}
.row{display:flex;gap:8px;align-items:center}
.chips{display:flex;gap:6px;overflow-x:auto;margin:10px 0 4px;scrollbar-width:none}
.chip{flex:none;border:1px solid var(--line);background:#fff;border-radius:999px;padding:5px 12px;font-size:13px}
.chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.list{display:grid;gap:8px}
.it{display:grid;grid-template-columns:60px 1fr auto;gap:10px;align-items:center;background:#fff;border-radius:10px;padding:8px;box-shadow:var(--shadow)}
.it img{width:60px;height:60px;object-fit:cover;border-radius:7px;background:#eee}
.it .nm{font-size:13.5px;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.it .pr{font-size:13px;color:var(--accent);font-weight:700;margin-top:2px}
.it .acts{display:flex;flex-direction:column;gap:6px}
.tag{display:inline-block;font-size:11px;border-radius:4px;padding:0 5px;margin-right:4px;vertical-align:1px}
.tag.c{background:#e7f3ec;color:var(--ok)}.tag.m{background:#fff3dc;color:var(--warn)}.tag.h{background:#eee;color:#777}
.it.off{opacity:.55}
.fab{position:fixed;right:18px;bottom:22px;height:52px;padding:0 20px;border-radius:26px;border:0;background:var(--accent);color:#fff;font-weight:800;font-size:16px;box-shadow:0 6px 18px rgba(229,56,31,.35);z-index:20}
.imgs{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
@media(min-width:600px){.imgs{grid-template-columns:repeat(6,1fr)}}
.imgs .ph{position:relative;aspect-ratio:1;border-radius:8px;overflow:hidden;background:#eee;border:1px solid var(--line)}
.imgs .ph img{width:100%;height:100%;object-fit:cover}
.imgs .ph .x{position:absolute;top:3px;right:3px;width:24px;height:24px;border-radius:50%;border:0;background:rgba(0,0,0,.6);color:#fff;font-size:13px;line-height:24px;padding:0}
.imgs .ph .l{position:absolute;bottom:3px;left:3px;height:22px;border-radius:6px;border:0;background:rgba(0,0,0,.55);color:#fff;font-size:11px;padding:0 6px}
.imgs .ph .cv{position:absolute;bottom:3px;left:3px;background:var(--accent);color:#fff;font-size:11px;border-radius:5px;padding:0 6px}
.imgs .add{aspect-ratio:1;border:2px dashed #ccc;border-radius:8px;display:grid;place-items:center;color:var(--ink2);font-size:12.5px;text-align:center;cursor:pointer;background:#fafafa}
.imgs .up{display:grid;place-items:center;font-size:12px;color:var(--ink2)}
.vrow{display:grid;grid-template-columns:1fr 92px 70px 32px;gap:6px;margin-top:8px;align-items:center}
.vrow input{padding:9px 8px}
.vhead{display:grid;grid-template-columns:1fr 92px 70px 32px;gap:6px;font-size:12px;color:var(--ink2);margin-top:6px}
.del{border:0;background:none;color:#999;font-size:18px;padding:0}
.hint{font-size:12.5px;color:var(--ink2);margin-top:6px}
.sw{display:flex;align-items:center;gap:10px;font-weight:600}
.sw input{width:22px;height:22px;accent-color:var(--ok)}
.bar{position:sticky;bottom:0;background:rgba(244,244,242,.95);backdrop-filter:blur(6px);padding:10px 0 14px;display:flex;gap:10px}
.bar .btn{flex:1}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:rgba(22,24,29,.92);color:#fff;padding:10px 18px;border-radius:999px;font-size:14px;opacity:0;transition:.25s;pointer-events:none;z-index:50;white-space:nowrap}
.toast.on{opacity:1}
.err{color:var(--accent);font-size:13px;margin-top:8px}
.more{display:block;margin:14px auto;padding:8px 20px;border:1px solid var(--line);background:#fff;border-radius:999px}
.empty{text-align:center;color:var(--ink2);padding:40px 0}
.nav{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;background:#e7e7e3;border-radius:10px;padding:4px;margin-bottom:12px}
.nav button{border:0;background:none;border-radius:8px;height:38px;font-weight:700;color:var(--ink2)}
.nav button.on{background:#fff;color:var(--ink);box-shadow:var(--shadow)}
.oc{background:#fff;border-radius:12px;box-shadow:var(--shadow);padding:12px 14px;display:grid;gap:6px}
.oc .top{display:flex;align-items:center;gap:8px}.oc .top b{font-size:15px}.oc .top .dt{color:var(--ink2);font-size:12.5px;flex:1}
.oc select{width:auto;padding:5px 8px;font-size:13px}
.oc .meta{font-size:13.5px}.oc .meta .tot{color:var(--accent);font-weight:800}
.oc details{font-size:13px;color:var(--ink2)}.oc pre{white-space:pre-wrap;font:inherit;margin:6px 0 0}
.code{background:#e7f3ec;border-radius:8px;padding:8px 10px;font-size:13px}.code b{font-size:20px;letter-spacing:1px;color:var(--ok);margin-right:6px}
.tag.b{background:#fde8e4;color:var(--accent)}
.oc .acts2{display:flex;gap:8px;flex-wrap:wrap}
.cr{background:#fff;border-radius:10px;box-shadow:var(--shadow);padding:10px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 8px;align-items:center}
.cr .nm2{font-weight:700}.cr input{padding:7px 9px;font-size:14px}.cr .kw{grid-column:1/-1}
.cr .ar{display:flex;gap:4px}.cr .ar button{width:32px;height:32px;border:1px solid var(--line);background:#fff;border-radius:7px;padding:0}
.cr .cnt{font-size:12px;color:var(--ink2)}
.pick{width:100%;display:flex;justify-content:space-between;align-items:center;border:1px solid var(--line);border-radius:8px;padding:10px 11px;background:#fff;font-size:15px;text-align:left}
.pick.empty{color:#999}
.pk{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.45);display:flex;align-items:flex-end;justify-content:center}
.pk .in{background:#fff;width:100%;max-width:560px;max-height:80vh;border-radius:16px 16px 0 0;display:flex;flex-direction:column}
.pk .h{display:flex;gap:8px;padding:12px 14px;border-bottom:1px solid var(--line)}
.pk .h button{border:0;background:none;font-size:22px;color:var(--ink2)}
.pk .ls{overflow:auto;padding:8px 14px 20px;display:grid;gap:6px}
.pk .ls button{text-align:left;border:1px solid var(--line);background:#fff;border-radius:10px;padding:11px 12px;font-size:15px}
.pk .ls button.on{border-color:var(--accent);color:var(--accent);font-weight:700}
.pk .ls button.new{border-style:dashed;color:var(--ok);font-weight:700}
/* ---------- 大量修改 ---------- */
.bulk{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--ink);color:#fff;padding:10px 16px calc(10px + env(safe-area-inset-bottom));display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:center;box-shadow:0 -4px 18px rgba(0,0,0,.2)}
.bulk select,.bulk input{width:auto;padding:7px 8px;font-size:14px;border-radius:7px;border:0}
.bulk input{width:90px}
.bulk .btn{height:36px}
.bulk .grp{display:flex;gap:4px;align-items:center}
.bulk .btn.gray{background:transparent;color:#ddd;border-color:#555}
.has-bulk .fab{display:none}.has-bulk main{padding-bottom:180px}
tr.sel td{background:#fff5f3!important}
.it.sel{outline:2px solid var(--accent)}
input.sel{width:18px;height:18px;accent-color:var(--accent);margin:0;cursor:pointer}
.qe input{width:100%;padding:6px 8px;font-size:14px}
.qe input.chg,.qe select.chg{background:#fff7d6;border-color:#e0b100}
.qe select{width:100%;padding:6px 8px;font-size:13.5px}
.qe td.pn{max-width:380px;line-height:1.35}
.qbar{position:sticky;bottom:0;background:rgba(244,244,242,.96);padding:10px 0;display:flex;gap:10px;z-index:5}
/* ---------- 首頁區塊 ---------- */
.hsec{background:#fff;border-radius:12px;box-shadow:var(--shadow);padding:12px;display:grid;gap:10px}
.hsec .top{display:flex;gap:8px;align-items:center}.hsec .top input{flex:1;min-width:0;font-weight:700}
.hsec .top button{width:34px;height:34px;border:1px solid var(--line);background:#fff;border-radius:7px;padding:0;flex:none}
.hp{display:grid;grid-template-columns:repeat(auto-fill,minmax(105px,1fr));gap:8px}
.hp .c{position:relative;border:1px solid var(--line);border-radius:8px;overflow:hidden;font-size:12.5px;line-height:1.35;background:#fafafa}
.hp .c img{width:100%;aspect-ratio:1;object-fit:cover;background:#eee}
.hp .c div{padding:5px 6px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.hp .c .x{position:absolute;top:4px;right:4px;width:24px;height:24px;border-radius:50%;border:0;background:rgba(0,0,0,.6);color:#fff;font-size:12px;padding:0}
.hp .c .l{position:absolute;top:4px;left:4px;height:22px;border-radius:6px;border:0;background:rgba(0,0,0,.55);color:#fff;font-size:11px;padding:0 6px}
.hp .c.off{opacity:.45}
.catb{border:1px dashed #c9c9c3;background:#fafaf8;border-radius:7px;padding:4px 9px;font-size:13px;color:var(--ink);white-space:nowrap;margin-top:4px;max-width:100%;overflow:hidden;text-overflow:ellipsis}
.catb:hover{border-color:var(--accent);color:var(--accent);background:#fff5f3}
.catb.saving{opacity:.5}
.bulk .main{background:var(--accent);color:#fff;border-color:var(--accent);font-size:15px;height:40px;padding:0 16px}
.bulk .more2{display:contents}.bulk.min .more2{display:none}
.pgr{display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:center;margin:12px 0;font-size:14px}
.pgr select{width:auto;padding:5px 6px;font-size:14px}.pgr .ps{color:var(--ink2)}
.pk .ls .pi{display:grid;grid-template-columns:44px 1fr auto;gap:8px;align-items:center;font-size:13.5px}
.pk .ls .pi img{width:44px;height:44px;object-fit:cover;border-radius:6px;background:#eee}
.pk .ls .pi.added{opacity:.5}
/* ---------- 電腦版 ---------- */
.tbar{display:flex;gap:8px;align-items:center;margin-bottom:10px;flex-wrap:wrap}
.tbar input{flex:1 1 100%;min-width:0}.tbar select{flex:1;min-width:0;width:auto}
.row>input{min-width:0}
html,body{overflow-x:hidden}
.addc{background:#fff;border-radius:12px;box-shadow:var(--shadow);padding:12px;margin-bottom:12px;display:grid;gap:8px;border:2px solid var(--ok)}
@media(min-width:900px){.tbar input{flex:1 1 0}.tbar select{flex:0 1 220px}}
.tbl{width:100%;border-collapse:separate;border-spacing:0;background:#fff;border-radius:12px;box-shadow:var(--shadow);overflow:hidden;font-size:14px}
.tbl th{background:#f0f0ec;text-align:left;font-weight:600;color:var(--ink2);padding:9px 10px;white-space:nowrap;font-size:13px}
.tbl th[data-s]{cursor:pointer}.tbl th[data-s]:hover{color:var(--ink)}
.tbl td{padding:8px 10px;border-top:1px solid var(--line);vertical-align:middle}
.tbl tr:hover td{background:#fafaf8}
.tbl tr.off td{opacity:.55}
.tbl td img{width:52px;height:52px;object-fit:cover;border-radius:6px;background:#eee;display:block}
.tbl .nm{cursor:pointer;line-height:1.4}
a.nm{color:inherit;text-decoration:none;display:block}
a.btn{display:inline-grid;place-items:center;text-decoration:none}.tbl .nm:hover{color:var(--accent)}
.tbl .pr{color:var(--accent);font-weight:700;white-space:nowrap}
.tbl .ac{white-space:nowrap;text-align:right}.tbl .ac .btn{margin-left:4px}
.tbl .sub{font-size:12.5px;color:var(--ink2)}
.tbl details{font-size:13px;color:var(--ink2)}.tbl details pre{white-space:pre-wrap;font:inherit;margin:4px 0 0;max-width:340px}
.tbl select{width:auto;padding:5px 8px;font-size:13px}
.tbl .code{display:inline-block;padding:4px 8px}.tbl .code b{font-size:15px}
.ecols{display:block}
@media(min-width:900px){
  main{max-width:1280px;padding:18px 24px 90px}.hd{max-width:1280px;padding:0 24px}
  .nav{max-width:620px}
  .ecols{display:grid;grid-template-columns:1.15fr 1fr;gap:14px;align-items:start}
  .ecols textarea#d{min-height:320px}
  #cl{grid-template-columns:1fr 1fr}
}
</style>
</head>
<body>
<header><div class="hd"><a class="home" href="#" id="home" title="回後台首頁"><span id="brand"><b>W</b></span><h1>商城後台</h1></a><a href="./" target="_blank">看商城 ↗</a></div></header>
<main id="app"><div class="empty">載入中…</div></main>
<div class="toast" id="toast"></div>
<input type="file" id="file" accept="image/*" multiple hidden>
<script src="shopee-sync.js"></script>

<script>
(() => {
'use strict';
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money = n => 'NT$' + Number(n).toLocaleString('en-US');
const ls = { get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } }, set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }, del(k) { try { localStorage.removeItem(k); } catch (e) {} } };
function toast(t) { const el = $('#toast'); el.textContent = t; el.classList.add('on'); clearTimeout(toast.t); toast.t = setTimeout(() => el.classList.remove('on'), 2000); }

let CFG, PROD, IMG, BASE = {}, ROWS = {}, pw = ls.get('wade_admin_pw', '');
let view = { tab: 'all', q: '', pg: 0, ps: Number(ls.get('wade_ps', 20)) || 20, cat: '', sk: '', sd: 1 };
// 分頁：一頁 view.ps 件
const pageOf = list => { const n = Math.max(1, Math.ceil(list.length / view.ps)); if (view.pg >= n) view.pg = n - 1; if (view.pg < 0) view.pg = 0; return list.slice(view.pg * view.ps, view.pg * view.ps + view.ps); };
function pager(list) {
  const n = Math.max(1, Math.ceil(list.length / view.ps)), cur = view.pg + 1;
  return `<div class="pgr"><button class="btn sm gray" data-pg="${view.pg - 1}"${cur <= 1 ? ' disabled' : ''}>‹ 上一頁</button>
    <span>第 <select data-pgsel>${Array.from({ length: n }, (_, k) => `<option value="${k}"${k === view.pg ? ' selected' : ''}>${k + 1}</option>`).join('')}</select> / ${n} 頁</span>
    <button class="btn sm gray" data-pg="${view.pg + 1}"${cur >= n ? ' disabled' : ''}>下一頁 ›</button>
    <span>跳到 <input type="number" data-jump min="1" max="${n}" placeholder="頁數" style="width:70px;padding:5px 6px;font-size:14px"> 頁</span>
    <span class="ps">每頁 <select data-ps>${[10, 15, 20, 30, 50].map(k => `<option${k === view.ps ? ' selected' : ''}>${k}</option>`).join('')}</select> 件</span></div>`;
}
function bindPager(redraw, guard) {
  const go = fn => (guard ? guard(fn) : fn());
  document.querySelectorAll('.pgr [data-pg]').forEach(b => b.onclick = () => go(() => { view.pg = +b.dataset.pg; redraw(); window.scrollTo(0, 0); }));
  document.querySelectorAll('.pgr [data-pgsel]').forEach(sel => sel.onchange = () => go(() => { view.pg = +sel.value; redraw(); window.scrollTo(0, 0); }));
  document.querySelectorAll('.pgr [data-jump]').forEach(i => i.onkeydown = e => { if (e.key !== 'Enter') return; const k = parseInt(i.value, 10), n = +i.max; if (k >= 1 && k <= n) go(() => { view.pg = k - 1; redraw(); window.scrollTo(0, 0); }); else { i.value = ''; toast(`請輸入 1～${n}`); } });
  document.querySelectorAll('.pgr [data-ps]').forEach(sel => sel.onchange = () => go(() => { view.ps = +sel.value; ls.set('wade_ps', view.ps); view.pg = 0; redraw(); }));
}
let REDRAW = null;
const SEL = new Set(); let LAST = null;
const wide = () => matchMedia('(min-width: 900px)').matches;
let _w = null; addEventListener('resize', () => { clearTimeout(_w); _w = setTimeout(() => { if (REDRAW && wide() !== REDRAW._w) REDRAW(); }, 200); });
const img = (id, tn) => {
  if (!id) return '';
  if (/^https?:/.test(id)) return /googleusercontent\.com\/d\//.test(id) ? id + (tn ? '=s400' : '=s1200') : id;
  return IMG + id + (tn ? '_tn' : '');
};

async function api(op, extra) {
  if (!CFG.gasUrl) throw new Error('config.json 尚未設定 gasUrl');
  const r = await fetch(CFG.gasUrl, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ action: 'shop_order', op, pw, ...extra }) });
  const j = await r.json();
  if (!j.ok) { if (j.error === '密碼錯誤') { pw = ''; ls.del('wade_admin_pw'); } throw new Error(j.error || '失敗'); }
  return j;
}

/* ---------- 啟動 ---------- */
Promise.all([fetch('config.json', { cache: 'no-cache' }).then(r => r.json()), fetch('products.json', { cache: 'no-cache' }).then(r => r.json())])
  .then(([c, p]) => { CFG = c; applyBrand(); PROD = p; IMG = p.img; p.items.forEach((x, k) => { x._k = k; BASE[x.i] = x; }); pw ? loadRows() : viewLogin(); })
  .catch(e => { $('#app').innerHTML = '<div class="empty">載入失敗：' + esc(e.message) + '</div>'; });

function viewLogin(msg) {
  $('#app').innerHTML = `<div class="box" style="max-width:380px;margin:40px auto"><h2>登入商城後台</h2>
    <label class="f"><span>後台密碼</span><input type="password" id="pw" autocomplete="current-password"></label>
    <button class="btn solid" style="width:100%;margin-top:14px" id="go">登入</button><div class="err" id="er">${esc(msg || '')}</div></div>`;
  const go = async () => {
    pw = $('#pw').value.trim(); if (!pw) return;
    $('#go').disabled = true; $('#go').textContent = '登入中…';
    try { await api('login'); ls.set('wade_admin_pw', pw); loadRows(); }
    catch (e) { $('#er').textContent = e.message; $('#go').disabled = false; $('#go').textContent = '登入'; }
  };
  $('#go').onclick = go; $('#pw').onkeydown = e => { if (e.key === 'Enter') go(); };
}

async function loadRows() {
  $('#app').innerHTML = '<div class="empty">讀取商品資料…</div>';
  try {
    const j = await api('list'); ROWS = {}; j.rows.forEach(r => ROWS[r.id] = r);
    const m = location.hash.match(/^#edit\/(.+)$/);
    const it = m && allItems().find(x => x.i === decodeURIComponent(m[1]));
    it ? viewEdit(it) : viewList();
  }
  catch (e) { pw ? $('#app').innerHTML = `<div class="empty">${esc(e.message)}<br><br><button class="btn" onclick="location.reload()">重試</button></div>` : viewLogin(e.message); }
}

/* ---------- 商品清單 ---------- */
function allItems() {
  const out = [];
  Object.values(ROWS).forEach(r => { if (!BASE[r.id] && r.item) out.push({ ...r.item, i: r.id, _kind: 'c', _on: r.on, _t: r.t }); });
  out.sort((a, b) => b._t - a._t);

      const v = CH[x.i] || x.v.map(r => [...r]);
      v[k][f] = i.value === '' ? '' : Number(i.value);
      const same = JSON.stringify(v) === JSON.stringify(x.v);
      if (same) delete CH[x.i]; else CH[x.i] = v;
      i.classList.toggle('chg', Number(i.value) !== x.v[k][f] || i.value === '');
      dirty();
    };
    const setCat = (sel, v) => { const x = byId[sel.dataset.cat]; sel.value = v; if (v === x.c) delete CC[x.i]; else CC[x.i] = v; sel.classList.toggle('chg', v !== x.c); };
    tb.onchange = e => { const sel = e.target.closest('select[data-cat]'); if (sel) { setCat(sel, sel.value); dirty(); } };
    if ($('#callq')) $('#callq').onchange = e => { const v = e.target.value; if (!v) return; tb.querySelectorAll('select[data-cat]').forEach(sel => setCat(sel, v)); e.target.value = ''; dirty(); toast(`這頁 ${show.length} 件都改成「${v}」，記得按儲存`); };
    tb.onkeydown = e => {
      if (e.key !== 'Enter') return; e.preventDefault();
      const ins = [...tb.querySelectorAll(`input[data-f="${e.target.dataset.f}"]`)], n = ins.indexOf(e.target);
      if (ins[n + 1]) { ins[n + 1].focus(); ins[n + 1].select(); }
    };
  }
  $('#qs').onclick = async () => {
    const ids = changedIds();
    for (const i of ids) if (CH[i] && CH[i].some(v => !(Number(v[1]) > 0))) return toast('「' + byId[i].n.slice(0, 20) + '」價格要大於 0');
    const b = $('#qs'); b.disabled = true;
    try {
      await saveMany(ids.map(i => { const it = cleanItem(byId[i]); if (CH[i]) it.v = CH[i].map(v => [v[0], Number(v[1]), v[2] === '' ? '' : Number(v[2]), v[3]]); if (CC[i]) it.c = CC[i]; return { item: it, on: byId[i]._on, src: BASE[i] ? 'shopee' : 'custom' }; }), b);
      await reloadRowsQuiet(); toast(`已儲存 ${ids.length} 件，網站約 5 分鐘內更新`); viewList();
    } catch (err) { alert(err.message); b.disabled = false; dirty(); }
  };
}
async function reloadRowsQuiet() { const j = await api('list'); ROWS = {}; j.rows.forEach(r => ROWS[r.id] = r); }

addEventListener('popstate', () => {

  $('#ha').onclick = () => { secs.push({ t: '本週精選', ids: [] }); ch(); draw(); $('#hl').lastElementChild.scrollIntoView({ block: 'center' }); };
  $('#ha2').onclick = () => { secs.push({ t: '超值套餐', ids: [] }); ch(); draw(); $('#hl').lastElementChild.scrollIntoView({ block: 'center' }); };
  $('#hl').oninput = e => { const t = e.target.closest('input[data-k]'); if (t) { secs[+t.dataset.k].t = t.value; ch(); } };
  $('#hl').onclick = e => {
    const b = e.target.closest('button'); if (!b) return; const d = b.dataset;
    if (d.up != null && +d.up > 0) { const k = +d.up; [secs[k - 1], secs[k]] = [secs[k], secs[k - 1]]; }
    else if (d.dn != null && +d.dn < secs.length - 1) { const k = +d.dn; [secs[k + 1], secs[k]] = [secs[k], secs[k + 1]]; }
    else if (d.rm != null) { if (!confirm(`刪除區塊「${secs[+d.rm].t}」？`)) return; secs.splice(+d.rm, 1); }

// 搜尋商品加進區塊（可連續點多個）
function pickProducts(ids, done) {
  const wrap = document.createElement('div'); wrap.className = 'pk';
  wrap.innerHTML = `<div class="in"><div class="h"><input id="pq" type="search" placeholder="搜尋商品名稱，點一下就加入"><button id="px">完成</button></div><div class="ls" id="pl"></div></div>`;
  document.body.appendChild(wrap);
  const items = allItems().filter(x => x._on);
  const draw = () => {
    const q = $('#pq').value.trim().toLowerCase(), ks = q.split(/\s+/).filter(Boolean);
    const list = (ks.length ? items.filter(x => ks.every(k => x.n.toLowerCase().includes(k))) : items.filter(x => x._kind === 'c').concat(items)).slice(0, 40);
    $('#pl').innerHTML = list.map(x => `<button class="pi${ids.includes(x.i) ? ' added' : ''}" data-id="${esc(x.i)}"><img src="${img(x.im && x.im[0], 1)}" alt=""><span>${esc(x.n)}</span><b>${ids.includes(x.i) ? '✓' : '＋'}</b></button>`).join('') || '<div class="hint">找不到商品</div>';
  };
  const close = () => { wrap.remove(); done(); };
  draw(); $('#pq').oninput = draw; $('#px').onclick = close;
  wrap.onclick = e => { if (e.target === wrap) close(); };
  $('#pl').onclick = e => { const b = e.target.closest('button[data-id]'); if (!b) return; const id = b.dataset.id, k = ids.indexOf(id); if (k < 0) ids.push(id); else ids.splice(k, 1); draw(); };
  setTimeout(() => $('#pq').focus(), 50);
}

        if (pics[code]) it.im = [pics[code]].concat((it.im || []).filter(u => /googleusercontent/.test(u) && u !== pics[code]));
        it.im = (it.im || []).filter(u => !/fartrust\.com\.tw/.test(u));   // 遠信的原始網址會破圖，拿掉
        it.v = [['', price, 99, id + '-1']]; it.lk = SYM_LIST_URL; it.lkt = '線上申辦分期';

/* ---------- 分類管理 ---------- */
async function saveConfig(cfg, withProducts) {
  const body = { config: JSON.stringify(cfg) };
  let prod = null;
  if (withProducts) {
    const cat = ShopeeSync.catOf(cfg.categories);
    prod = { ...PROD, items: PROD.items.map(p => ({ ...p, c: cat(p.n) })) };
    prod.cats = cfg.categories.map(c => ({ k: c.n, n: c.n, cnt: prod.items.filter(p => p.c === c.n).length })).filter(c => c.cnt);
    prod.items.forEach(p => { delete p._k; });
    body.products = JSON.stringify(prod);
  }
  await api('save_config', body);
  CFG = cfg;
  if (prod) { PROD = prod; BASE = {}; PROD.items.forEach((x, k) => { x._k = k; BASE[x.i] = x; }); }
}
function viewCats() {
  window.scrollTo(0, 0); REDRAW = null;
  const rows = CFG.categories.map(c => ({ n: c.n, k: c.k.join('、'), g: c.g, orig: c.n }));
  const counts = {}; allItems().forEach(p => counts[p.c] = (counts[p.c] || 0) + 1);
  let q = '';
  const draw = () => {
    const vis = rows.map((r, i) => ({ r, i })).filter(({ r }) => !q || (r.n + r.k).toLowerCase().includes(q.toLowerCase()));
    $('#cl').innerHTML = vis.map(({ r, i }) => {
      const other = !r.k && i === rows.length - 1;
      return `<div class="cr"><input data-i="${i}" data-f="n" value="${esc(r.n)}"${other ? ' disabled' : ''}>
        <div class="ar"><button data-mv="-1" data-i="${i}">↑</button><button data-mv="1" data-i="${i}">↓</button>${other ? '' : `<button data-del="${i}">✕</button>`}</div>
        ${other ? '<div class="cnt kw">對不到任何分類的商品會放這裡</div>' : `<input class="kw" data-i="${i}" data-f="k" value="${esc(r.k)}" placeholder="標題關鍵字（用、分開），例：KOSO、koso部品">`}
        <div class="cnt kw">${counts[r.orig] || 0} 件商品</div></div>`;
    }).join('') || '<div class="empty">找不到分類</div>';
  };
  $('#app').innerHTML = nav('c') + `<div class="row" style="margin-bottom:10px"><input id="cq" type="search" placeholder="搜尋分類"><button class="btn sm" style="height:44px;white-space:nowrap" id="cadd">＋ 新增分類</button></div>
    <div class="hint" style="margin:-2px 0 10px">商品標題含有關鍵字，就會分進這個分類（由上往下比對）。順序也是商城顯示的順序。</div>
    <div class="list" id="cl"></div>
    <div class="bar"><button class="btn solid" id="csave">儲存並重新分類</button></div><div class="err" id="cer"></div>`;
  bindNav(); draw();
  $('#cq').oninput = e => { q = e.target.value.trim(); draw(); };
  $('#cadd').onclick = () => {
    if ($('#addc')) return $('#an').focus();
    $('#cl').insertAdjacentHTML('beforebegin', `<div class="addc" id="addc"><b>新增分類</b>
      <input id="an" placeholder="分類名稱，例：RAK部品">
      <input id="ak" placeholder="標題關鍵字（用、分開），例：RAK">
      <div class="hint" style="margin:0">商品標題有這些字，就會自動分進這個分類；留空就只能手動指定。</div>
      <div class="row"><button class="btn sm gray" id="ax" style="flex:1;height:40px">取消</button><button class="btn sm solid" id="ao" style="flex:2;height:40px">加入</button></div></div>`);
    $('#an').focus();
    $('#an').oninput = () => { if (!$('#ak').dataset.t) $('#ak').value = $('#an').value.trim().replace(/部品$/, ''); };
    $('#ak').oninput = () => { $('#ak').dataset.t = 1; };
    $('#ax').onclick = () => $('#addc').remove();
    $('#ao').onclick = () => {
      const name = $('#an').value.trim(); if (!name) return $('#an').focus();
      if (rows.some(r => r.n === name)) return toast('已經有這個分類');
      rows.splice(rows.length - 1, 0, { n: name, k: $('#ak').value.trim(), orig: name });
      $('#addc').remove(); q = ''; $('#cq').value = ''; draw();
      const el = $('#cl').children[rows.length - 2]; if (el) { el.scrollIntoView({ block: 'center' }); el.style.outline = '2px solid var(--ok)'; }
      toast('已加入，記得按「儲存並重新分類」');
    };
  };
  $('#cl').oninput = e => { const t = e.target.closest('input[data-i]'); if (t) rows[+t.dataset.i][t.dataset.f] = t.value; };
  $('#cl').onclick = e => {
    const mv = e.target.closest('[data-mv]'), del = e.target.closest('[data-del]');
    if (mv) { const i = +mv.dataset.i, j = i + +mv.dataset.mv; if (j < 0 || j >= rows.length - 1 || i >= rows.length - 1) return; [rows[i], rows[j]] = [rows[j], rows[i]]; draw(); }
    if (del) { const i = +del.dataset.del; if (confirm(`刪除分類「${rows[i].n}」？\n裡面的商品會依關鍵字重新分到其他分類。`)) { rows.splice(i, 1); draw(); } }
  };
  $('#csave').onclick = async () => {
    const er = $('#cer'); er.textContent = '';
    const names = rows.map(r => r.n.trim());
    if (names.some(n => !n)) return er.textContent = '分類名稱不能空白';
    if (new Set(names).size !== names.length) return er.textContent = '有重複的分類名稱';
    const cats = rows.map(r => { const c = { n: r.n.trim(), k: String(r.k || '').split(/[、,，\s]+/).map(x => x.trim()).filter(Boolean) }; if (r.g) c.g = 1; return c; });
    const b = $('#csave'); b.disabled = true; b.textContent = '儲存中（約 10 秒）…';
    try { await saveConfig({ ...CFG, categories: cats }, true); toast('已儲存，商城約 1～2 分鐘後更新'); viewCats(); }
    catch (err) { er.textContent = err.message; b.disabled = false; b.textContent = '儲存並重新分類'; }
  };
}

async function viewOrders() {

    let list = j.orders;
    if (OV.f === 'todo') list = list.filter(o => !done.includes(o.status));
    if (OV.f === 'cvs') list = list.filter(o => String(o.ship).includes('7-11'));
    if (OV.f === 'bad') list = list.filter(o => /未取|退回/.test(String(o.lstat || '')));

    const fs = [['todo', '處理中'], ['cvs', '7-11'], ['bad', '未取件／退回' + (nBad ? ' ' + nBad : '')], ['all', '全部']];

        ? `<table class="tbl"><thead><tr><th>訂單</th><th>客人</th><th>取貨／付款</th><th>金額</th><th>商品</th><th>狀態</th><th>物流</th></tr></thead><tbody>${list.map(otr).join('')}</tbody></table>`

      catch (err) { toast(err.message); }
    };
    $('#ol').onclick = async e => {
      const b = e.target.closest('button[data-a]'); if (!b) return;
      const o = j.orders.find(x => x.no === b.dataset.no);
      if (b.dataset.a === 'copy') { navigator.clipboard?.writeText(o.code).then(() => toast('已複製寄件代碼')); return; }
      if (b.dataset.a === 'cvs') {
        if (!confirm(`建立 7-11 寄件單？\n${o.name}　${o.where}\n${o.pay}　NT$${o.total}`)) return;
        b.disabled = true; b.textContent = '建立中…';
        try { const r = await api('cvs_create', { no: o.no }); o.code = r.code; o.lid = r.lid; o.lstat = '已建立' + (r.stage ? '（測試）' : ''); if (!done.includes(o.status)) o.status = '已付款-待出貨'; draw(); toast('寄件代碼：' + r.code); }
        catch (err) { alert(err.message); b.disabled = false; b.textContent = '建立 7-11 寄件單'; }
      }
      if (b.dataset.a === 'block') {
        if (!confirm(`把 ${o.name}（${o.phone}）加入黑名單？\n之後這支手機只能先匯款，這筆訂單會改成「取消」。`)) return;
        try { await api('block', { no: o.no }); o.blocked = true; o.status = '取消'; draw(); toast('已加入黑名單'); } catch (err) { alert(err.message); }
      }
    };

  function otr(o) {
    const d = new Date(o.at), dt = isNaN(d) ? '' : `${d.getMonth() + 1}/${d.getDate()} ${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}`;
    const cvs = String(o.ship).includes('7-11');
    return `<tr class="${o.status === '取消' ? 'off' : ''}"><td><b>${esc(o.no)}</b><div class="sub">${dt}</div></td>
      <td>${o.blocked ? '<span class="tag b">黑名單</span>' : ''}${esc(o.name)}<div class="sub"><a href="tel:${esc(o.phone)}">${esc(o.phone)}</a>${o.lineId ? '　LINE：' + esc(o.lineId) : ''}</div></td>
      <td>${esc(o.ship)}｜${esc(o.pay)}<div class="sub">${esc(o.where)}${o.last5 ? '<br>匯款後五碼：' + esc(o.last5) : ''}</div></td>
      <td class="pr">NT$${Number(o.total).toLocaleString()}</td>
      <td><details><summary>${esc(String(o.detail).split('\n').length)} 項${o.note ? '・有備註' : ''}</summary><pre>${esc(o.detail)}${o.bike ? '\n車款：' + esc(o.bike) : ''}${o.note ? '\n備註：' + esc(o.note) : ''}${o.memo ? '\n處理：' + esc(o.memo) : ''}</pre></details></td>
      <td><select data-no="${esc(o.no)}">${j.statuses.map(st => `<option${st === o.status ? ' selected' : ''}>${esc(st)}</option>`).join('')}</select></td>
      <td>${cvs && o.code ? `<span class="code">代碼 <b>${esc(o.code)}</b></span> <button class="btn sm gray" data-a="copy" data-no="${esc(o.no)}">複製</button><div class="sub">${lst(o)}</div>` : ''}
        ${cvs && !o.code && o.status !== '取消' ? `<button class="btn sm solid" data-a="cvs" data-no="${esc(o.no)}">建立 7-11 寄件單</button>` : ''}
        ${String(o.pay) === '取貨付款' && !o.blocked && o.status !== '取消' ? `<div style="margin-top:4px"><button class="btn sm gray" data-a="block" data-no="${esc(o.no)}">未取貨→黑名單</button></div>` : ''}</td></tr>`;
  }
  function oc(o) {
    const d = new Date(o.at), dt = isNaN(d) ? '' : `${d.getMonth() + 1}/${d.getDate()} ${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}`;
    const cvs = String(o.ship).includes('7-11');
    return `<div class="oc"><div class="top"><b>${esc(o.no)}</b><span class="dt">${dt}</span>
      <select data-no="${esc(o.no)}">${j.statuses.map(st => `<option${st === o.status ? ' selected' : ''}>${esc(st)}</option>`).join('')}</select></div>
      <div class="meta">${o.blocked ? '<span class="tag b">黑名單</span>' : ''}${esc(o.name)}　<a href="tel:${esc(o.phone)}">${esc(o.phone)}</a>${o.lineId ? '　LINE：' + esc(o.lineId) : ''}</div>
      <div class="meta">${esc(o.ship)}｜${esc(o.pay)}｜<span class="tot">NT$${Number(o.total).toLocaleString()}</span></div>
      <div class="hint" style="margin:0">${esc(o.where)}${o.last5 ? '　匯款後五碼：' + esc(o.last5) : ''}</div>
      <details><summary>商品明細${o.note ? '・有備註' : ''}</summary><pre>${esc(o.detail)}${o.bike ? '\n車款：' + esc(o.bike) : ''}${o.note ? '\n備註：' + esc(o.note) : ''}${o.memo ? '\n處理：' + esc(o.memo) : ''}</pre></details>
      ${cvs && o.code ? `<div class="code">寄件代碼 <b>${esc(o.code)}</b><button class="btn sm gray" data-a="copy" data-no="${esc(o.no)}">複製</button><div class="hint" style="margin:2px 0 0">${lst(o)}</div></div>` : ''}
      <div class="acts2">${cvs && !o.code && o.status !== '取消' ? `<button class="btn sm solid" data-a="cvs" data-no="${esc(o.no)}">建立 7-11 寄件單</button>` : ''}
        ${String(o.pay) === '取貨付款' && !o.blocked && o.status !== '取消' ? `<button class="btn sm gray" data-a="block" data-no="${esc(o.no)}">未取貨→加黑名單</button>` : ''}</div></div>`;
  }
  draw();
}

// 分類選擇器：可搜尋，沒有的分類可以直接新增
function pickCat(cur, done) {
  const wrap = document.createElement('div'); wrap.className = 'pk';
  wrap.innerHTML = `<div class="in"><div class="h"><input id="pq" type="search" placeholder="搜尋或輸入新分類名稱"><button id="px">✕</button></div><div class="ls" id="pl"></div></div>`;
  document.body.appendChild(wrap);
  const close = () => wrap.remove();
  const draw = () => {
    const q = $('#pq').value.trim(), list = catList().filter(c => !q || c.toLowerCase().includes(q.toLowerCase()));
    const canNew = q && !catList().some(c => c === q);
    $('#pl').innerHTML = (canNew ? `<button class="new" data-new="${esc(q)}">＋ 新增分類「${esc(q)}」</button>` : '') +
      list.map(c => `<button data-c="${esc(c)}" class="${c === cur ? 'on' : ''}">${esc(c)}</button>`).join('') ||
      '<div class="hint">輸入名稱就能新增分類</div>';
  };
  draw(); $('#pq').oninput = draw; $('#px').onclick = close;
  wrap.onclick = e => { if (e.target === wrap) close(); };
  $('#pl').onclick = e => {
    const b = e.target.closest('button'); if (!b) return;
    if (b.dataset.new) { done(b.dataset.new); toast('儲存商品時會一起新增這個分類'); } else done(b.dataset.c);
    close();
  };
  setTimeout(() => $('#pq').focus(), 50);
}

/* ---------- 從蝦皮同步 ---------- */
function viewSync() {
  window.scrollTo(0, 0); REDRAW = null;
  $('#app').innerHTML = `<button class="btn sm gray" id="back">‹ 返回清單</button>
  <div class="box" style="margin-top:12px"><h2>從蝦皮同步商品</h2>
    <ol style="margin:0;padding-left:20px;font-size:14px;line-height:1.8">
      <li>用電腦到蝦皮賣家中心 → 我的商品 → 批次處理</li>
      <li>分別下載 3 個模板：<b>商品標題及描述</b>、<b>價格及庫存</b>、<b>媒體資訊</b></li>
      <li>在下面一次選取這 3 個檔案（zip 不用解壓）</li></ol>
    <label class="f"><span>選擇檔案</span><input type="file" id="sf" multiple accept=".xlsx,.zip"></label>
    <div class="hint">你在官網改過的價格、分類、說明、上下架都會保留，不會被蓋掉。</div>
    <div id="sr" style="margin-top:14px"></div></div>`;
  $('#back').onclick = () => viewList();
  $('#sf').onchange = async e => {
    const files = [...e.target.files]; if (!files.length) return;
    const sr = $('#sr'), log = t => sr.innerHTML = `<div class="hint">⏳ ${esc(t)}…</div>`;
    try {
      const r = await ShopeeSync.build(files, CFG, log);
      const oldIds = new Set(PROD.items.map(p => p.i)), newIds = new Set(r.products.items.map(p => p.i));
      const added = r.products.items.filter(p => !oldIds.has(p.i)), removed = PROD.items.filter(p => !newIds.has(p.i));
      let changed = 0; const byOld = {}; PROD.items.forEach(p => byOld[p.i] = p);
      r.products.items.forEach(p => { const o = byOld[p.i]; if (o && JSON.stringify(o.v) !== JSON.stringify(p.v)) changed++; });
      sr.innerHTML = `<div class="box" style="background:#f7f7f5;box-shadow:none;margin:0"><b>讀取完成</b>
        <div style="font-size:14px;margin-top:6px;line-height:1.8">商品 ${r.stats.items} 個（規格 ${r.stats.vars} 個）<br>
        🆕 新商品 <b>${added.length}</b> 個　✏️ 價格／庫存有變 <b>${changed}</b> 個　🗑 蝦皮已刪除 <b>${removed.length}</b> 個</div>
        ${added.length ? `<div class="hint">新商品：${added.slice(0, 5).map(p => esc(p.n.slice(0, 18))).join('、')}${added.length > 5 ? '…' : ''}</div>` : ''}
        <button class="btn solid" style="width:100%;margin-top:12px" id="pub">發佈到網站</button><div class="err" id="pe"></div></div>`;
      $('#pub').onclick = async () => {
        const b = $('#pub'); b.disabled = true; b.textContent = '發佈中（約 10 秒）…';
        try {
          await api('publish', { products: JSON.stringify(r.products), desc: JSON.stringify(r.desc) });
          PROD = r.products; BASE = {}; PROD.items.forEach((x, k) => { x._k = k; BASE[x.i] = x; }); descCache = r.desc;
          sr.innerHTML = '<div class="box" style="background:#e7f3ec;box-shadow:none;margin:0">✅ 已發佈！網站約 1～2 分鐘後更新。</div>';
        } catch (err) { $('#pe').textContent = err.message; b.disabled = false; b.textContent = '發佈到網站'; }
      };
    } catch (err) { sr.innerHTML = `<div class="err">${esc(err.message)}</div>`; }
  };
}

// 手機照片縮到最長邊 1200px 的 JPEG，回傳 base64
function shrink(file, max = 1200, type = 'image/jpeg') {
  return new Promise((res, rej) => {
    const url = URL.createObjectURL(file), im = new Image();
    im.onload = () => {
      const s = Math.min(1, max / Math.max(im.width, im.height));
      const cv = document.createElement('canvas'); cv.width = Math.round(im.width * s); cv.height = Math.round(im.height * s);
      const cx = cv.getContext('2d'); if (type === 'image/jpeg') { cx.fillStyle = '#fff'; cx.fillRect(0, 0, cv.width, cv.height); } cx.drawImage(im, 0, 0, cv.width, cv.height);
      URL.revokeObjectURL(url); res(cv.toDataURL(type, 0.85).split(',')[1]);
    };
    im.onerror = () => { URL.revokeObjectURL(url); rej(new Error('無法讀取這張照片')); };
    im.src = url;
  });
}
