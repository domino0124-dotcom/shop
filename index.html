/* ---------- 後台新增／修改的商品（存在試算表，經 GAS 讀取）---------- */
function applyExtras(ex) {
  const over = {}, hid = new Set((ex && ex.hidden) || []);
  ((ex && ex.items) || []).forEach(p => { over[p.i] = p; });
  const items = [];
  BASE.forEach(p => { if (hid.has(p.i)) return; if (over[p.i]) { items.push({ ...over[p.i], _idx: p._idx, _ov: 1 }); delete over[p.i]; } else items.push(p); });
  Object.values(over).forEach(p => { if (!hid.has(p.i)) items.push({ ...p, _idx: -(p._t || 1) }); });
  BYID = {};
  items.forEach(p => { p._s = (p.n + ' ' + p.v.map(v => v[0]).join(' ')).toLowerCase(); BYID[p.i] = p; });
  DATA.items = items;
  cleanCart();
}
function loadExtras() {
  if (!CFG.gasUrl) { extrasDone = true; return; }
  fetch(CFG.gasUrl, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ action: 'shop_order', op: 'items' }) })
    .then(r => r.json()).then(res => {
      if (!res.ok) throw new Error(res.error);
      const ex = { at: Date.now(), items: res.items || [], hidden: res.hidden || [] };
      const old = store.get('wade_extras', null);
      const changed = !old || JSON.stringify([old.items, old.hidden]) !== JSON.stringify([ex.items, ex.hidden]);
      store.set('wade_extras', ex);
      const wasWaiting = !extrasDone; extrasDone = true;
      if (changed) { applyExtras(ex); renderCats(); markCat(); }
      const onList = !/^#\/(p|cart|checkout|done)/.test(location.hash);
      if (/^#\/p\//.test(location.hash) && ($('#waitP') || (wasWaiting && changed))) route();   // 商品頁也換成後台改過的最新資料
      else if (changed && onList && window.scrollY < 300) viewList();
    }).catch(err => { console.warn('extras', err); extrasDone = true; if ($('#waitP')) route(); });
}

/* ---------- cart ---------- */
function findVar(p, vid) { return p && p.v.find(v => v[3] === vid); }
function cleanCart() { cart = cart.filter(c => findVar(BYID[c.i], c.v) && !BYID[c.i].lk); saveCart(); }
function saveCart() { store.set('wade_cart', cart); badge(); }
function badge() { const n = cart.reduce((a, c) => a + c.q, 0); $('#badge').textContent = n ? (n > 99 ? '99+' : n) : ''; }
function maxQty(v) { return Math.max(1, Math.min(99, v[2] || 99)); }
function addCart(i, vid, q) {
  const v = findVar(BYID[i], vid); const ex = cart.find(c => c.i === i && c.v === vid);
  if (ex) ex.q = Math.min(maxQty(v), ex.q + q); else cart.push({ i, v: vid, q: Math.min(maxQty(v), q) });
  saveCart();
}
function cartLines() {
  return cart.map(c => { const p = BYID[c.i], v = findVar(p, c.v); return { c, p, v, sub: v[1] * c.q }; });
}
// 商品設成「免運」：購物車有它（或全部都是，看 config.freeShip.rule）且取貨方式在 freeShip.ships 內 → 運費 0
function fsHit(method) {
  const f = CFG.freeShip || { ships: ['cvs'], rule: 'any' };
  if (!f.ships.includes(method) || !cart.length) return false;
  const ps = cart.map(c => BYID[c.i]).filter(Boolean);
  return f.rule === 'all' ? ps.every(p => p.fs) : ps.some(p => p.fs);
}
const fsLabel = () => (CFG.freeShip && CFG.freeShip.ships || ['cvs']).map(k => CFG.shipping[k] ? CFG.shipping[k].name : k).join('、') + ' 免運';
// 商品自訂運費：sc＝7-11、sh＝宅配；nc＝不能寄 7-11。一個包裹取最貴的運費
const itemFee = (p, method, base) => method === 'cvs' ? (p.sc != null ? p.sc : base) : method === 'home' ? (p.sh != null ? p.sh : base) : base;
const cvsBlocked = () => cart.some(c => BYID[c.i] && BYID[c.i].nc);
function shipFee(method, subtotal) {
  const s = CFG.shipping[method]; if (!s) return 0;
  if (fsHit(method)) return 0;
  if (CFG.freeShippingOver > 0 && subtotal >= CFG.freeShippingOver && method !== 'store') return 0;
  const base = s.fee || 0, ps = cart.map(c => BYID[c.i]).filter(Boolean);
  return ps.length ? Math.max(...ps.map(p => itemFee(p, method, base))) : base;
}

  if (o1) o1.onclick = e => { const b = e.target.closest('.opt'); if (!b || b.disabled) return; sel1 = sel1 === b.dataset.o ? null : b.dataset.o; if (sel1) showOptImg(sel1); refresh(); };
  if (o2) o2.onclick = e => { const b = e.target.closest('.opt'); if (!b || b.disabled) return; sel2 = sel2 === b.dataset.o ? null : b.dataset.o; refresh(); };
  if (!single && t1.length === 1 && stockOf(t1[0], null)) sel1 = t1[0];
  if (two && t2.length === 1) sel2 = t2[0];
  const setQ = n => { const v = cur(); qty = Math.max(1, Math.min(v ? maxQty(v) : 99, n | 0 || 1)); $('#qn').value = qty; };
  $('#qm').onclick = () => setQ(qty - 1); $('#qp').onclick = () => setQ(qty + 1); $('#qn').onchange = e => setQ(+e.target.value);
  function go(buy) {
    const v = cur();
    if (!v) { toast('請先選擇' + (two ? (sel1 === null ? (p.t || '規格') : (p.t2 || '選項')) : (p.t || '規格'))); (o1 || o2).scrollIntoView({ block: 'center', behavior: 'smooth' }); return; }
    if (v[2] <= 0) return toast('此規格已售完');
    addCart(p.i, v[3], qty);
    if (buy) location.hash = '#/cart'; else toast('已加入購物車');
  }
  $('#add').onclick = () => go(false); $('#buy').onclick = () => go(true);
  $('#ask').onclick = () => { const v = cur(); $('#ask').href = lineMsg(`我想問這個商品：\n${p.n}${v && v[0] ? '\n規格：' + vName(v[0]) : ''}\n${location.origin + location.pathname}#/p/${p.i}`); };
  refresh();

  loadDesc().then(() => {
    const dd = DESC[p.i]; const el = $('#dbody'); if (!el) return;
    const d = [p.d != null ? p.d : (dd ? dd[0] : ''), dd ? dd[1] : []];
    if (!d[0] && !d[1].length) { el.textContent = '詳細規格與適用車種歡迎 LINE 詢問。'; return; }
    el.className = '';
    el.innerHTML = (d[0] ? `<pre>${esc(d[0])}</pre>` : '') + d[1].map(id => `<img loading="lazy" src="${img(id)}" alt="">`).join('');
  });
}

/* ---------- cart view ---------- */
function viewCart() {
  markCat(); document.title = '購物車｜韋德機車精品';
  if (!cart.length) {
    $('#app').innerHTML = `<div class="bar"><h1>購物車</h1></div><div class="box empty">購物車是空的<br><br><a class="btn solid" style="display:inline-grid;place-items:center;padding:0 24px;text-decoration:none" href="#/">去逛逛</a></div>`;
    return;
  }
  const L = cartLines(); const sub = L.reduce((a, l) => a + l.sub, 0);
  $('#app').innerHTML = `<div class="bar"><h1>購物車<small>${L.length} 項</small></h1></div>
  <div class="lay"><div class="box">${L.map((l, k) => `<div class="ci">
      <a href="#/p/${l.p.i}"><img src="${img((l.p.oi && l.p.oi[(l.v[0] || '').split(',')[0].trim()]) || l.p.im[0], 1)}" alt=""></a>
      <div><a class="nm" href="#/p/${l.p.i}">${esc(l.p.n)}</a>${l.v[0] ? `<div class="vn">${esc(vName(l.v[0]))}</div>` : ''}
        <div class="bt"><div class="qty"><button data-k="${k}" data-d="-1">−</button><input data-k="${k}" type="number" inputmode="numeric" value="${l.c.q}"><button data-k="${k}" data-d="1">＋</button></div>
        <span class="price">${money(l.sub)}</span></div>
        <button class="del" data-del="${k}">刪除</button></div></div>`).join('')}</div>
    <div class="box"><div class="sum"><span>商品小計</span><span>${money(sub)}</span></div>
      <div class="hint">運費於下一步選擇取貨方式後計算</div>
      <button class="btn solid block" style="margin-top:14px" onclick="location.hash='#/checkout'">前往結帳</button>
      <a href="#/" style="display:block;text-align:center;margin-top:12px;font-size:13px;color:var(--ink2)">繼續購物</a></div></div>`;
  const app = $('#app');
  app.onclick = e => {
    const b = e.target.closest('button[data-d]'), d = e.target.closest('[data-del]');
    if (b) { const c = cart[+b.dataset.k]; const v = findVar(BYID[c.i], c.v); c.q = Math.max(1, Math.min(maxQty(v), c.q + +b.dataset.d)); saveCart(); viewCart(); }
    if (d) { cart.splice(+d.dataset.del, 1); saveCart(); viewCart(); }
  };
  app.onchange = e => { const i = e.target.closest('input[data-k]'); if (!i) return; const c = cart[+i.dataset.k]; const v = findVar(BYID[c.i], c.v); c.q = Math.max(1, Math.min(maxQty(v), +i.value | 0 || 1)); saveCart(); viewCart(); };
}

/* ---------- checkout ---------- */
function viewCheckout() {
  markCat(); $('#chat').hidden = true; document.title = '結帳｜韋德機車精品';
  $('#app').onclick = null; $('#app').onchange = null;
  const L = cartLines(); const sub = L.reduce((a, l) => a + l.sub, 0);
  const saved = store.get('wade_buyer', {});
  const ships = Object.entries(CFG.shipping);
  let ship = saved.ship && CFG.shipping[saved.ship] ? saved.ship : ships[0][0];
  const noCvs = cvsBlocked(); if (noCvs && ship === 'cvs') ship = ships.find(([k]) => k !== 'cvs')[0];
  let pay = null;
  const fv = (k) => esc(saved[k] || '');

  $('#app').innerHTML = `<button class="back" onclick="location.hash='#/cart'">‹ 回購物車</button>
  <form id="fm" novalidate><div class="lay"><div>
    <div class="box"><h2>取貨方式</h2><div class="radios" id="ships">${ships.map(([k, s]) => `<label class="radio" data-k="${k}"><input type="radio" name="ship" value="${k}"><span class="r">${esc(s.name)}</span><small>${k === 'cvs' && noCvs ? '購物車有大型商品，無法寄 7-11' : shipFee(k, sub) ? '運費 ' + money(shipFee(k, sub)) + (s.feeFrom && shipFee(k, sub) === s.fee ? ' 起' : '') : (s.fee ? '<b style="color:var(--ok)">免運</b>' : '免運')}</small></label>`).join('')}</div>
      <div id="shipExtra"></div></div>
    <div class="box"><h2>付款方式</h2><div class="radios" id="pays"></div><div class="hint" id="payHint"></div></div>
    <div class="box"><h2>訂購人資料</h2>
      <label class="f" data-f="name"><span>姓名 <i>*</i></span><input name="name" autocomplete="name" value="${fv('name')}"><div class="em" id="nameEm">請填寫姓名</div><div class="hint" id="nameHint"></div></label>
      <label class="f" data-f="phone"><span>手機 <i>*</i></span><input name="phone" type="tel" inputmode="tel" autocomplete="tel" placeholder="09xxxxxxxx" value="${fv('phone')}"><div class="em">請填寫正確的手機號碼（09 開頭 10 碼）</div></label>
      <label class="f"><span>LINE ID（方便我們聯絡確認庫存）</span><input name="lineId" value="${fv('lineId')}"></label>
      <label class="f"><span>Email</span><input name="email" type="email" inputmode="email" autocomplete="email" value="${fv('email')}"></label>
      <label class="f"><span>機車車款（選填，幫您確認是否適用）</span><input name="bike" placeholder="例：勁戰六代、DRG" value="${fv('bike')}"></label>
      <label class="f"><span>備註</span><textarea name="note" rows="2">${fv('note')}</textarea></label>
      <input class="hp" name="website" tabindex="-1" autocomplete="off">
    </div></div>
    <div><div class="box"><h2>訂單明細</h2>
      ${L.map(l => `<div class="sum" style="font-size:13.5px;gap:10px"><span>${esc(l.p.n)}${l.v[0] ? '（' + esc(vName(l.v[0])) + '）' : ''} ×${l.c.q}</span><span style="white-space:nowrap">${money(l.sub)}</span></div>`).join('')}
      <div class="sum" style="border-top:1px solid var(--line);margin-top:8px;padding-top:8px"><span>商品小計</span><span>${money(sub)}</span></div>
      <div class="sum"><span>運費</span><span id="fee"></span></div>
      <div class="sum total"><span>總計</span><span id="tot"></span></div>
      <div class="hint" id="feeNote" style="color:var(--warn)"></div>
      <label class="agree"><input type="checkbox" id="agree"><span>我了解網站庫存不一定同步，訂單需店家確認有貨後才成立。</span></label>
      <button class="btn solid block" style="margin-top:14px" id="submit" type="submit">送出訂單</button>
      <div class="hint" id="sErr" style="color:var(--accent)"></div>
    </div></div></div></form>`;

  function renderShip() {
    document.querySelectorAll('#ships .radio').forEach(r => { const on = r.dataset.k === ship; r.classList.toggle('on', on); r.querySelector('input').checked = on; });
    const ex = $('#shipExtra');
    if (ship === 'home') ex.innerHTML = `<label class="f" data-f="address"><span>收件地址 <i>*</i></span><input name="address" autocomplete="street-address" value="${fv('address')}"><div class="em">請填寫收件地址</div></label>`;
    else if (ship === 'cvs') {
      ex.innerHTML = `<button type="button" class="btn block" id="mapBtn" style="margin-top:12px">📍 ${saved.cvsId ? '重新選擇' : '選擇'} 7-11 門市</button>
      ${saved.cvsAddr ? `<div class="hint">門市地址：${fv('cvsAddr')}</div>` : ''}
      <label class="f" data-f="cvsStore"><span>7-11 門市名稱 <i>*</i></span><input name="cvsStore" placeholder="按上方按鈕選擇門市" value="${fv('cvsStore')}"><div class="em">請選擇門市</div></label>
      <label class="f" data-f="cvsId"><span>門市店號（6 碼）<i>*</i></span><input name="cvsId" inputmode="numeric" maxlength="6" placeholder="選擇門市後自動帶入" value="${fv('cvsId')}"><div class="em">請選擇門市</div></label>`;
      $('#mapBtn').onclick = openMap;
    }
    else ex.innerHTML = `<div class="hint" style="margin-top:10px">門市：${esc(CFG.address)}<br>${CFG.hours.map(esc).join('　')}</div>`;
    const pays = CFG.shipping[ship].pay;
    if (!pays.includes(pay)) pay = pays.includes(saved.pay) ? saved.pay : pays[0];
    $('#pays').innerHTML = pays.map(k => `<label class="radio${k === pay ? ' on' : ''}" data-k="${k}"><input type="radio" name="pay" value="${k}"${k === pay ? ' checked' : ''}><span class="r">${esc(CFG.payNames[k])}</span></label>`).join('');
    renderPay();
  }
  function renderPay() {
    document.querySelectorAll('#pays .radio').forEach(r => { const on = r.dataset.k === pay; r.classList.toggle('on', on); r.querySelector('input').checked = on; });
    $('#payHint').textContent = pay === 'transfer' ? `確認有貨後請於 ${CFG.transferDays} 天內轉帳，送出後會顯示匯款帳號。` : pay === 'cod' ? '商品到店後，於 7-11 取貨時付款。' : '到店取貨時付款，可付現。';
    const fee = shipFee(ship, sub), sf = CFG.shipping[ship]; const fromTag = sf.feeFrom && fee === sf.fee ? ' 起' : ''; $('#fee').textContent = fee ? money(fee) + fromTag : '免運'; $('#tot').textContent = money(sub + fee) + (fee ? fromTag : '');
    $('#feeNote').textContent = sf.feeNote || '';
    $('#nameHint').textContent = ship === 'cvs' ? '7-11 取貨要核對證件，請填真實姓名（中文 2～5 字）' : '';
  }
  async function openMap() {
    const fd = Object.fromEntries(new FormData($('#fm')).entries());
    store.set('wade_buyer', { ...store.get('wade_buyer', {}), name: fd.name, phone: fd.phone, lineId: fd.lineId, email: fd.email, bike: fd.bike, note: fd.note, ship, pay });
    if (!CFG.gasUrl) return toast('測試模式無法開啟門市地圖');
    const b = $('#mapBtn'); b.disabled = true; b.textContent = '開啟 7-11 門市地圖中…';
    try {
      const r = await fetch(CFG.gasUrl, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ action: 'shop_order', op: 'map' }) }).then(r => r.json());
      if (!r.ok) throw new Error(r.error);
      const f = document.createElement('form'); f.method = 'POST'; f.action = r.url;
      const add = (k, v) => { const i = document.createElement('input'); i.type = 'hidden'; i.name = k; i.value = v; f.appendChild(i); };
      add('MerchantID', r.MerchantID); add('LogisticsType', 'CVS'); add('LogisticsSubType', 'UNIMARTC2C');
      add('IsCollection', pay === 'cod' ? 'Y' : 'N'); add('ServerReplyURL', CFG.gasUrl + '?shopmap=1');
      add('Device', /Mobi|Android|iPhone/i.test(navigator.userAgent) ? '1' : '0');
      document.body.appendChild(f); f.submit();
    } catch (err) { b.disabled = false; b.textContent = '📍 選擇 7-11 門市'; toast('無法開啟地圖：' + err.message); }
  }
  if (noCvs) { const r = document.querySelector('#ships .radio[data-k="cvs"]'); if (r) { r.style.opacity = .45; r.style.cursor = 'not-allowed'; } }
  $('#ships').onclick = e => { const r = e.target.closest('.radio'); if (!r) return; if (r.dataset.k === 'cvs' && noCvs) { e.preventDefault(); return toast('購物車有大型商品，無法寄 7-11'); } if (r.dataset.k !== ship) { ship = r.dataset.k; renderShip(); } };
  $('#pays').onclick = e => { const r = e.target.closest('.radio'); if (r) { pay = r.dataset.k; renderPay(); } };
  renderShip();
  $('#fm').addEventListener('input', e => { const f = e.target.closest('.f.err'); if (f) f.classList.remove('err'); if (e.target.id === 'agree') $('#sErr').textContent = ''; });

  $('#fm').onsubmit = async e => {
    e.preventDefault();
    const fd = Object.fromEntries(new FormData(e.target).entries());
    Object.keys(fd).forEach(k => fd[k] = String(fd[k]).trim());
    const bad = [];
    if (!fd.name) bad.push('name');
    fd.phone = fd.phone.replace(/[\s-]/g, ''); if (!/^09\d{8}$/.test(fd.phone)) bad.push('phone');
    if (ship === 'home' && !fd.address) bad.push('address');
    if (ship === 'cvs') { if (!fd.cvsStore) bad.push('cvsStore'); if (!/^\d{6}$/.test(fd.cvsId || '')) bad.push('cvsId'); }
    const cvsNameBad = ship === 'cvs' && fd.name && !/^[\u4e00-\u9fff]{2,5}$|^[A-Za-z]{4,10}$/.test(fd.name);
    if (cvsNameBad) bad.push('name');
    $('#nameEm').textContent = cvsNameBad ? '7-11 取貨姓名需為中文 2～5 字（不含空格、符號），或英文 4～10 字' : '請填寫姓名';
    document.querySelectorAll('.f[data-f]').forEach(f => f.classList.toggle('err', bad.includes(f.dataset.f)));
    if (bad.length) { document.querySelector('.f.err').scrollIntoView({ block: 'center', behavior: 'smooth' }); return; }
    if (ship === 'cvs' && sub + shipFee(ship, sub) > 20000) { $('#sErr').textContent = '7-11 店到店單筆上限 20,000 元，請改用宅配或來店自取'; return; }
    if (!$('#agree').checked) { $('#sErr').textContent = '請勾選同意上方說明'; return; }
    if (fd.website) return; // 機器人
    store.set('wade_buyer', { name: fd.name, phone: fd.phone, lineId: fd.lineId, email: fd.email, bike: fd.bike, address: fd.address, cvsStore: fd.cvsStore, cvsId: fd.cvsId, cvsAddr: fd.cvsId === saved.cvsId ? saved.cvsAddr : '', ship, pay, note: '' });

    const order = {
      action: 'shop_order', ship, pay,
      customer: { name: fd.name, phone: fd.phone, lineId: fd.lineId, email: fd.email, bike: fd.bike, address: fd.address || '', cvsStore: fd.cvsStore || '', cvsId: fd.cvsId || '' },
      note: fd.note, items: cart.map(c => ({ i: c.i, v: c.v, q: c.q })), clientTotal: sub + shipFee(ship, sub)
    };
    const btn = $('#submit'); btn.disabled = true; btn.textContent = '送出中…'; $('#sErr').textContent = '';
    try {
      let res;
      if (!CFG.gasUrl) {
        await new Promise(r => setTimeout(r, 600));
        res = { ok: true, demo: true, orderNo: 'TEST' + Date.now().toString().slice(-6), total: order.clientTotal, ship, pay };
      } else {
        const r = await fetch(CFG.gasUrl, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(order) });
        res = await r.json();
      }
      if (!res.ok) throw new Error(res.error || '送出失敗');
      lastOrder = { ...res, ship, pay, name: fd.name, at: Date.now(), lines: cartLines().map(l => [l.p.n, l.v[0], l.c.q, l.sub]) };
      store.set('wade_last_order', lastOrder);
      cart = []; saveCart();
      location.hash = '#/done';
    } catch (err) {
      btn.disabled = false; btn.textContent = '送出訂單';
      $('#sErr').innerHTML = esc(err.message || err) + `<br>若一直失敗，請 <a href="${CFG.line}" target="_blank" rel="noopener">LINE</a> 或來電 ${esc(CFG.phone)}`;
    }
  };
}

/* ---------- done ---------- */
function viewDone() {
  markCat(); document.title = '訂單已送出｜韋德機車精品';
  const o = lastOrder;
  if (!o) { location.hash = '#/'; return; }
  const b = CFG.bank;
  const payBlock = o.pay === 'transfer' ? `<div class="box" style="text-align:left"><h2>匯款資訊</h2>
      <div class="hint" style="margin:-4px 0 10px;color:var(--warn)">請等我們確認有貨後再匯款（${CFG.transferDays} 天內）</div>
      <dl class="kv"><dt>銀行</dt><dd>${esc(b.bankName)}（${esc(b.bankCode)}）</dd>
      <dt>帳號</dt><dd>${esc(b.account)}<button class="copy" data-c="${esc(b.account)}">複製</button></dd>
      <dt>戶名</dt><dd>${esc(b.holder)}</dd>
      <dt>金額</dt><dd style="color:var(--accent)">${money(o.total)}${CFG.shipping[o.ship].feeFrom ? '<br><small style="color:var(--warn);font-weight:400">運費可能調整，請以我們確認的金額為準</small>' : ''}</dd></dl>
      <div class="hint">匯款後請 LINE 告訴我們「訂單編號＋帳號後五碼」。</div></div>`
    : `<div class="box" style="text-align:left"><h2>付款方式</h2>${esc(CFG.payNames[o.pay])}　${money(o.total)}</div>`;
  $('#app').innerHTML = `<div class="done"><div class="ck">✓</div><h1 style="font-size:20px;margin:6px 0">訂單已送出</h1>
    <div class="stock">訂單編號</div><div class="ono">${esc(o.orderNo)}<button class="copy" data-c="${esc(o.orderNo)}">複製</button></div>
    <p class="stock" style="margin:10px 0 18px">我們會盡快用 LINE 或電話跟您確認庫存與出貨時間</p></div>
    <div style="max-width:520px;margin:0 auto">
      ${o.demo ? '<div class="tip" style="margin:0 0 14px">這是測試訂單，沒有真的送出</div>' : ''}
      ${payBlock}
      <div class="box" style="text-align:left"><h2>取貨方式</h2>${esc(CFG.shipping[o.ship].name)}
        ${(o.lines || []).map(l => `<div class="sum" style="font-size:13px;gap:10px"><span>${esc(l[0])}${l[1] ? '（' + esc(l[1]) + '）' : ''} ×${l[2]}</span><span>${money(l[3])}</span></div>`).join('')}</div>
      <a class="linebtn" href="${CFG.line}" target="_blank" rel="noopener">加 LINE 好友 ${esc(CFG.lineId)}</a>
      <a href="#/" style="display:block;text-align:center;margin:16px 0;color:var(--ink2)">繼續購物</a></div>`;
  $('#app').onclick = e => { const c = e.target.closest('.copy'); if (!c) return; navigator.clipboard?.writeText(c.dataset.c).then(() => toast('已複製')); };
}

/* ---------- footer ---------- */
function renderFoot() {
  $('#foot').innerHTML = `<div><h3>購物須知</h3><ul>${CFG.notice.map(n => `<li>${esc(n)}</li>`).join('')}</ul></div>
  <div><h3>${esc(CFG.shopName)}</h3>${esc(CFG.address)}<br>電話 ${esc(CFG.phone)}　手機 ${esc(CFG.mobile)}<br>${CFG.hours.map(esc).join('<br>')}<br>
  <a href="${CFG.line}" target="_blank" rel="noopener">LINE ${esc(CFG.lineId)}</a><br><span style="font-size:12px">商品資料更新：${esc(DATA.updated)}</span></div>`;
}
})();
</script>
</body>
</html>
